<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TrustMail</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --cyan: #06b6d4; --blue: #3b82f6;
      --safe: #22c55e; --low: #84cc16; --suspicious: #f59e0b;
      --phishing: #ef4444; --dangerous: #dc2626;
      --bg: #050a0f; --card: rgba(15,23,42,0.9); --border: rgba(99,102,241,0.25);
      --text: #f1f5f9; --muted: #94a3b8; --dim: #475569;
    }
    html, body { width: 400px; min-height: 540px; background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; }

    .header { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; border-bottom: 1px solid #1e293b; }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 32px; height: 32px; border-radius: 8px; background: linear-gradient(135deg, var(--cyan), var(--blue)); display: flex; align-items: center; justify-content: center; font-size: 18px; }
    .logo h1 { font-size: 15px; font-weight: 700; background: linear-gradient(135deg, var(--cyan), var(--blue)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .logo p { font-size: 10px; color: var(--dim); }
    .status-pill { display: flex; align-items: center; gap: 5px; font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid; }
    .status-online  { color: var(--safe); border-color: #166534; background: #052e16; }
    .status-offline { color: var(--phishing); border-color: #7f1d1d; background: #2d0000; }
    .status-checking{ color: var(--muted); border-color: #334155; background: #0f172a; }

    .risk-card { margin: 12px; padding: 16px; border-radius: 16px; border: 1px solid; background: rgba(15,23,42,0.8); }
    .risk-card.safe        { border-color: #166534; background: rgba(5,46,22,0.5); }
    .risk-card.low_risk    { border-color: #3f6212; background: rgba(26,46,5,0.5); }
    .risk-card.suspicious  { border-color: #92400e; background: rgba(45,27,0,0.5); }
    .risk-card.phishing    { border-color: #7f1d1d; background: rgba(45,0,0,0.5); }
    .risk-card.highly_dangerous { border-color: #991b1b; background: rgba(69,10,10,0.5); }
    .risk-row { display: flex; align-items: center; gap: 14px; }
    .ring-wrap { position: relative; flex-shrink: 0; }
    .ring-wrap svg { transform: rotate(-90deg); }
    .ring-label { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .ring-pct { font-size: 16px; font-weight: 700; line-height: 1; }
    .ring-sub { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .risk-info { flex: 1; min-width: 0; }
    .risk-label-row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
    .risk-icon { font-size: 18px; }
    .risk-name { font-size: 17px; font-weight: 700; }
    .risk-desc { font-size: 11px; color: var(--muted); margin-bottom: 8px; }
    .confidence-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
    .confidence-bar { height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; }
    .confidence-fill { height: 100%; border-radius: 2px; transition: width 0.6s ease; }
    .reasons { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
    .reason { display: flex; align-items: flex-start; gap: 6px; font-size: 11px; color: #cbd5e1; }
    .reason-arrow { flex-shrink: 0; font-size: 11px; }

    .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid #1e293b; overflow-x: auto; }
    .tab { padding: 8px 10px; font-size: 11px; font-weight: 500; color: var(--dim); border: none; background: none; cursor: pointer; border-bottom: 2px solid transparent; white-space: nowrap; }
    .tab.active { color: var(--cyan); border-bottom-color: var(--cyan); }
    .tab:hover:not(.active) { color: var(--muted); }

    .tab-content { padding: 12px; min-height: 150px; overflow-y: auto; max-height: 260px; }
    .hidden { display: none; }

    .section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; }
    .section-title { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .finding-row { display: flex; align-items: flex-start; gap: 8px; padding: 6px 0; border-bottom: 1px solid #1e293b22; }
    .finding-row:last-child { border-bottom: none; }
    .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 3px; flex-shrink: 0; }
    .finding-name { font-weight: 500; font-size: 12px; }
    .finding-val { font-size: 11px; color: var(--muted); }
    .tag { font-size: 10px; padding: 2px 7px; border-radius: 999px; border: 1px solid; margin: 2px; display: inline-block; }
    .url-item { background: #0f172a; border-radius: 8px; padding: 8px; margin-bottom: 6px; }
    .url-code { font-family: 'Courier New', monospace; font-size: 10px; color: #cbd5e1; word-break: break-all; margin-bottom: 5px; }
    .url-risk { font-size: 12px; font-weight: 700; }
    .bar-row { margin-bottom: 8px; }
    .bar-label { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px; }
    .bar-track { height: 4px; background: #1e293b; border-radius: 2px; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 2px; }

    .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; text-align: center; min-height: 300px; gap: 12px; }
    .empty-icon { font-size: 48px; opacity: 0.25; }
    .empty h2 { font-size: 15px; font-weight: 600; color: #cbd5e1; }
    .empty p { font-size: 12px; color: var(--muted); max-width: 260px; line-height: 1.5; }
    .offline-warn { background: #2d0000; border: 1px solid #7f1d1d; border-radius: 10px; padding: 10px 14px; font-size: 11px; color: #fca5a5; line-height: 1.6; }
    .offline-warn code { font-family: monospace; color: #f87171; }

    .footer { display: flex; align-items: center; justify-content: space-between; padding: 8px 14px; border-top: 1px solid #1e293b; font-size: 11px; color: var(--dim); }
    .footer-btn { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 11px; padding: 3px 8px; border-radius: 6px; }
    .footer-btn:hover { background: #1e293b; color: var(--text); }
  </style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">🛡️</div>
    <div>
      <h1>TrustMail</h1>
      <p>AI Email Shield</p>
    </div>
  </div>
  <div id="status-pill" class="status-pill status-checking">
    <span id="status-dot">⬤</span>
    <span id="status-text">Checking...</span>
  </div>
</div>

<div id="app"></div>

<script src="popup.js"></script>
</body>
</html>
